spring.application.name=road-trip-backend

# ----------------------------------------------------------------------------
# DATABASE CONNECTION
# Replace <your_password> with your real local MySQL password before running.
# createDatabaseIfNotExist=true means you do NOT have to manually create the
# "roadtrip_db" schema first - MySQL will create an empty one on first connect.
# ----------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/roadtrip_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Siddu@73
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------------------------
# JPA / HIBERNATE
# ddl-auto=update -> Hibernate reads the @Entity classes and creates/updates
# the tables for you automatically every time the app starts. Great for
# development. In a real production system you would switch this to
# "validate" and manage schema changes with Flyway/Liquibase instead.
# show-sql=true just prints the generated SQL to the console so you can see
# what Hibernate is doing - very useful while learning.
# ----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------------------------------------------
# JWT (JSON Web Token) SETTINGS
# app.jwt.secret must be at least 256 bits (32+ characters) for the HS256
# algorithm we use in JwtUtil. Generate your own random string for production,
# never commit a real secret to GitHub.
# app.jwt.expiration-ms = how long a token stays valid (here: 24 hours).
# ----------------------------------------------------------------------------
app.jwt.secret=ReplaceThisWithALongRandomSecretKeyForJWT12345678
app.jwt.expiration-ms=86400000

server.port=8080
